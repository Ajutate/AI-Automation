<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Test Automation Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0093E9 0%, #80D0C7 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f8f9ff;
        }

        .upload-area.dragover {
            background: #e8ebff;
            border-color: #764ba2;
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        input[type="file"] {
            display: none;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .radio-group {
            display: flex;
            gap: 20px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radio-option input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            margin-top: 30px;
            padding: 20px;
            border-radius: 6px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .status.loading {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-content {
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
        }

        .download-buttons {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .download-btn {
            flex: 1;
            padding: 10px;
            background: #28a745;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background: #218838;
        }

        .file-name {
            margin-top: 10px;
            padding: 10px;
            background: #e8ebff;
            border-radius: 6px;
            font-weight: 600;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Test Automation Generator</h1>
            <p>Upload BRD/User Story documents to generate Gherkin Features & Selenium Tests</p>
        </div>

        <div class="card">
            <form id="uploadForm">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📄</div>
                    <h3>Click to upload or drag & drop</h3>
                    <p>Supported formats: .txt, .doc, .docx, .pdf</p>
                    <input type="file" id="fileInput" accept=".txt,.doc,.docx,.pdf" required>
                </div>

                <div id="fileName" class="file-name" style="display: none;"></div>

                <div class="form-group">
                    <label for="baseName">Output File Name:</label>
                    <input type="text" id="baseName" value="GeneratedTest" placeholder="e.g., UserLoginTest" required>
                </div>

                <div class="form-group">
                    <label>Model Quality:</label>
                    <div class="checkbox-group">
                        <input type="checkbox" id="useStrongModel" checked>
                        <label for="useStrongModel" style="margin-bottom: 0;">Use stronger model (better quality, slower)</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Workflow Type:</label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="workflowStandard" name="workflow" value="standard" checked>
                            <label for="workflowStandard" style="margin-bottom: 0;">Standard</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="workflowParallel" name="workflow" value="parallel">
                            <label for="workflowParallel" style="margin-bottom: 0;">Parallel (with validation)</label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn" id="submitBtn">
                    Generate Tests
                </button>
            </form>

            <div id="status" class="status"></div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const uploadForm = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const status = document.getElementById('status');

        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());

        // File selection
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileName.style.display = 'block';
                fileName.textContent = `📎 Selected: ${file.name}`;
            }
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const file = e.dataTransfer.files[0];
            if (file) {
                fileInput.files = e.dataTransfer.files;
                fileName.style.display = 'block';
                fileName.textContent = `📎 Selected: ${file.name}`;
            }
        });

        // Form submission
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('base_name', document.getElementById('baseName').value);
            formData.append('use_strong_model', document.getElementById('useStrongModel').checked);
            formData.append('use_parallel', document.querySelector('input[name="workflow"]:checked').value === 'parallel');

            // Show loading
            status.className = 'status loading';
            status.style.display = 'flex';
            status.innerHTML = '<div class="spinner"></div><div>Generating tests... This may take a minute.</div>';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    // Show success
                    status.className = 'status success';
                    status.style.display = 'block';
                    
                    const featureFileName = result.files.feature.split('\\').pop().split('/').pop();
                    const testFileName = result.files.test.split('\\').pop().split('/').pop();
                    
                    status.innerHTML = `
                        <div>
                            <strong>✅ Generation Successful!</strong>
                            <p>Generated Files:</p>
                            <ul>
                                <li>Feature: ${featureFileName}</li>
                                <li>Test: ${testFileName}</li>
                            </ul>
                            
                            <div class="download-buttons">
                                <a href="/download/feature/${featureFileName}" class="download-btn" download>
                                    📥 Download Feature File
                                </a>
                                <a href="/download/test/${testFileName}" class="download-btn" download>
                                    📥 Download Test File
                                </a>
                            </div>
                            
                            <details style="margin-top: 15px;">
                                <summary style="cursor: pointer; font-weight: 600;">View Feature File</summary>
                                <div class="result-content">${escapeHtml(result.feature_content)}</div>
                            </details>
                            
                            <details style="margin-top: 10px;">
                                <summary style="cursor: pointer; font-weight: 600;">View Test File</summary>
                                <div class="result-content">${escapeHtml(result.test_content)}</div>
                            </details>
                        </div>
                    `;
                } else {
                    throw new Error(result.detail || 'Generation failed');
                }
            } catch (error) {
                status.className = 'status error';
                status.style.display = 'block';
                status.innerHTML = `<strong>❌ Error:</strong> ${error.message}`;
            } finally {
                submitBtn.disabled = false;
            }
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
