name: Generate and Run Selenium Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'data/*.txt'
      - 'data/*.docx'
      - 'ai_automation/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      brd_file:
        description: 'BRD file path (relative to data/)'
        required: true
        default: 'brd_sample.txt'
      test_name:
        description: 'Base name for generated tests'
        required: true
        default: 'GeneratedTest'

jobs:
  generate-tests:
    name: Generate Test Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Start Ollama service
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull qwen2.5:latest

      - name: Generate Selenium tests from BRD
        run: |
          python main.py \
            --brd data/${{ github.event.inputs.brd_file || 'brd_sample.txt' }} \
            --base-name ${{ github.event.inputs.test_name || 'GeneratedTest' }} \
            --use-strong-model

      - name: Upload generated tests
        uses: actions/upload-artifact@v4
        with:
          name: generated-tests
          path: |
            outputs/features/*.feature
            outputs/tests/*.java
          retention-days: 30

  compile-tests:
    name: Compile Java Tests
    needs: generate-tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated tests
        uses: actions/download-artifact@v4
        with:
          name: generated-tests
          path: outputs/

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Prepare test directory structure
        run: |
          mkdir -p test-project/src/test/java/com/automation
          cp outputs/tests/*.java test-project/src/test/java/com/automation/
          cp cicd/pom.xml test-project/

      - name: Compile tests with Maven
        working-directory: test-project
        run: |
          mvn clean compile test-compile
          echo "✅ Compilation successful!"

      - name: Upload compiled tests
        uses: actions/upload-artifact@v4
        with:
          name: compiled-tests
          path: test-project/target/
          retention-days: 7

  run-tests:
    name: Execute Selenium Tests
    needs: compile-tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled tests
        uses: actions/download-artifact@v4
        with:
          name: compiled-tests
          path: test-project/target/

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver

      - name: Run Selenium tests
        working-directory: test-project
        run: |
          mvn test -Dtest=**/*Test.java
        continue-on-error: true

      - name: Generate test report
        if: always()
        run: |
          mvn surefire-report:report
        working-directory: test-project

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-project/target/surefire-reports/
            test-project/target/site/surefire-report.html
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-project/target/surefire-reports/*.xml
